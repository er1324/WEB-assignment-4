<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Forms</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link active" href="index.html">Basic Forms</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="bootstrap-forms.html">Bootstrap Forms</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="registration.html">Registration Form</a>
    </li>
  </ul>
</nav>
<div class="page-container">
  <section class="mb-3">
    <h3>Task 0: Simple Contact Form</h3>
    <form>
      <div class="mb-3">
        <label for="name0" class="form-label">Name</label>
        <input type="text" class="form-control" id="name0">
      </div>
      <div class="mb-3">
        <label for="email0" class="form-label">Email</label>
        <input type="text" class="form-control" id="email0">
      </div>
      <div class="mb-3">
        <label for="message0" class="form-label">Message</label>
        <textarea class="form-control" id="message0" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </section>
  <section>
    <h3>Task 1: Form with HTML5 Validation</h3>
    <form>
      <div class="mb-3">
        <label for="name1" class="form-label">Name</label>
        <input type="text" class="form-control" id="name1" required maxlength="50">
      </div>
      <div class="mb-3">
        <label for="email1" class="form-label">Email</label>
        <input type="email" class="form-control" id="email1" required>
      </div>
      <div class="mb-3">
        <label for="message1" class="form-label">Message</label>
        <textarea class="form-control" id="message1" rows="3" required maxlength="500"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
