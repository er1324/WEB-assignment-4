<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Forms</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="index.html">Basic Forms</a>
    </li>
    <li class="nav-item">
      <a class="nav-link active" href="bootstrap-forms.html">Bootstrap Forms</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="registration.html">Registration Form</a>
    </li>
  </ul>
</nav>
<div class="page-container">
  <section class="mb-5">
    <h3>Task 2: Bootstrap Form Styling</h3>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="name2" class="form-label">Name</label>
        <input type="text" class="form-control" id="name2" placeholder="Enter your name">
        <div class="form-text">Please enter your full name.</div>
      </div>
      <div class="col-md-6">
        <label for="email2" class="form-label">Email</label>
        <input type="email" class="form-control" id="email2" placeholder="name@example.com">
        <div class="form-text">We will never share your email.</div>
      </div>
      <div class="col-12">
        <label for="message2" class="form-label">Message</label>
        <textarea class="form-control" id="message2" rows="3" placeholder="Enter your message"></textarea>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </section>
  <section>
    <h3>Task 3: Bootstrap Validation Styles</h3>
    <form class="row g-3 needs-validation" novalidate>
      <div class="col-md-6">
        <label for="validationCustom01" class="form-label">Name</label>
        <input type="text" class="form-control" id="validationCustom01" required>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Name is required.</div>
      </div>
      <div class="col-md-6">
        <label for="validationCustom02" class="form-label">Email</label>
        <input type="email" class="form-control" id="validationCustom02" required>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Email is required.</div>
      </div>
      <div class="col-12">
        <label for="validationCustom03" class="form-label">Message</label>
        <textarea class="form-control" id="validationCustom03" rows="3" required></textarea>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Message is required.</div>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Submit Form</button>
      </div>
    </form>
  </section>
</div>
<script>
(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
